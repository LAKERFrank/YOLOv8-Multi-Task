# Multi-Task YOLOv8n (Detect+Pose) with 12-channel input
nc: 2                # Detect: shuttlecock + person
ch: 12               # 输入通道
kpt_shape: [17, 3]   # Keypoints format

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0‐P1/2 (in=12 → out=64)
  - [-1, 1, Conv, [128, 3, 2]]   # 1‐P2/4
  - [-1, 3, C2f,  [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]   # 3‐P3/8
  - [-1, 6, C2f,  [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]   # 5‐P4/16
  - [-1, 6, C2f,  [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7‐P5/32
  - [-1, 3, C2f,  [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]     # 9

head:
  - [-1, 1,   nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6],1,   Concat,    [1]]
  - [-1, 3,   C2f,         [512]]   # 12

  - [-1, 1,   nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4],1,   Concat,    [1]]
  - [-1, 3,   C2f,         [256]]   # 15

  - [-1, 1,   Conv,      [256, 3, 2]]
  - [[-1,12],1,   Concat,    [1]]
  - [-1, 3,   C2f,         [512]]   # 18

  - [-1, 1,   Conv,      [512, 3, 2]]
  - [[-1, 9],1,   Concat,    [1]]
  - [-1, 3,   C2f,         [1024]]  # 21

  # —— Multi‐Task Heads ——  
  - [[15,18,21], 1, Detect, [nc]]          # Detect → 2 类  
  - [[15,18,21], 1, Pose,   [1, kpt_shape]]  # Pose    → 1 类 (仅 person)

anchors:
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90,156,198,373,326]

# activation: silu
bn_momentum: 0.03
# gr: 1.0
